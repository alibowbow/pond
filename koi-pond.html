<html lang="en">

<title>Koi Pond Garden</title>
<style>
:root {
  --glass: rgba(20, 24, 28, 0.42);
  --glass-strong: rgba(18, 21, 25, 0.62);
  --sheen: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02) 42%, rgba(255,255,255,0));
  --line: rgba(255, 255, 255, 0.14);
  --line-soft: rgba(255, 255, 255, 0.08);
  --text: #eef1f2;
  --muted: rgba(238, 241, 242, 0.62);
  --accent: #f0894c;
  --blur: blur(20px) saturate(1.6);
  --radius: 14px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e11; color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.glass { background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
  position: relative; }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--sheen); pointer-events: none; }

#loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, #1b2a2c 0%, #0b0e11 70%); transition: opacity 0.8s ease; }
#loader.done { opacity: 0; pointer-events: none; }
#loader .lt { font-family: var(--serif); font-size: 30px; letter-spacing: 0.04em; margin-bottom: 6px; }
#loader .lj { font-family: var(--serif); font-size: 15px; color: var(--muted); letter-spacing: 0.3em; margin-bottom: 26px; }
#loader .bar { width: min(320px, 70vw); height: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
#loader .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #f6b98f, var(--accent)); transition: width 0.25s ease; }
#loader .ls { margin-top: 12px; color: var(--muted); font-size: 12px; min-height: 16px; }

#hud { position: fixed; left: 14px; top: 14px; z-index: 20; padding: 6px 11px; font: 600 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: 0.02em; pointer-events: none; }
#hud b { color: #fff; font-weight: 700; }
#hud span { color: var(--muted); font-weight: 500; }

<body>
<div id="loader"><div class="lt">Koi Pond Garden</div><div class="lj">鯉 の 池</div><div class="bar"><i></i></div><div class="ls">Preparing…</div></div>
<div id="hud" class="glass"><b id="fps">--</b> <span>fps</span> · <b id="ms">--</b> <span>ms</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
'use strict';
/* =====================================================================================
   0. PARAMETERS & CONSTANTS
   ===================================================================================== */
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const DEG = Math.PI / 180;
const LAYER = { ABOVE: 1, UNDER: 2, BOTH: 3, WATER: 4, SKY: 5, SURFACE: 6 };
const WATER_Y = 0;                 // mean water level (m)
const SIM_N = 256;                 // ripple simulation resolution
const SIM_SIZE = 13.4;             // ripple simulation square (m)
const SIM_C = { x: 0.1, z: -0.3 }; // centre of the simulation square
const MAX_KOI = 20;
const IOR_WATER = 1.333;

// GUI-bound parameters (defaults)
const P = {
  weather: 'Sunny', tod: 10.5, azimuth: 55, wind: 0.35, windDir: 35,
  clarity: 1.6, waveHeight: 1.0, caustics: 1.0,
  fishCount: 20,
  quality: 'High', autoDrop: true, exposure: 0.9, bloom: 0.3, bloomThreshold: 0.9, ssao: 1.0, godRays: 1.0,
  grain: 0.01, vignette: 0.32, sharpen: 0.35,
  dof: true, fstop: 8, maxBokeh: 12,
  tour: true, letterbox: true, seasonLoop: false, camMode: 'Cinematic', followFish: 0, pathSpeed: 1.0,
  stayAbove: false, hold: false, freeze: false, clean: false, volume: 0.7, sound: true,
};

// Weather / season presets (cross-faded)
const WEATHER = {
  Sunny:  { tod: 10.5, cloud: 0.55, turbidity: 2.0, overcast: 0.0,  sunMul: 1.0, hemiMul: 1.0, fog: 0.004, fogColor: [0.5, 0.58, 0.68],
            rain: 0, wet: 0, snow: 0, snowCover: 0, ice: 0, autumn: 0, wind: 0.35, exposure: 0.9,  grade: [1.035, 1.0, 0.955], koi: 1.0 },
  Rain:   { tod: 13.0, cloud: 1.0,  turbidity: 6.0, overcast: 0.85, sunMul: 0.1, hemiMul: 2.1, fog: 0.02,  fogColor: [0.2, 0.225, 0.25],
            rain: 1, wet: 1, snow: 0, snowCover: 0, ice: 0, autumn: 0, wind: 0.55, exposure: 1.15, grade: [0.98, 1.0, 1.03], koi: 0.85 },
  Autumn: { tod: 15.7, cloud: 0.42, turbidity: 4.5, overcast: 0.0,  sunMul: 1.0, hemiMul: 1.0, fog: 0.013, fogColor: [0.62, 0.52, 0.4],
            rain: 0, wet: 0, snow: 0, snowCover: 0, ice: 0, autumn: 1, wind: 0.45, exposure: 0.9,  grade: [1.07, 1.0, 0.9], koi: 0.9 },
  Winter: { tod: 11.5, cloud: 0.95, turbidity: 3.0, overcast: 0.7,  sunMul: 0.3, hemiMul: 1.9, fog: 0.024, fogColor: [0.56, 0.6, 0.66],
            rain: 0, wet: 0, snow: 1, snowCover: 1, ice: 1, autumn: 0.75, wind: 0.2, exposure: 1.0, grade: [0.97, 1.0, 1.04], koi: 0.35 },
};
const WEATHER_NAMES = Object.keys(WEATHER);

// Gerstner swell: wavelengths (m), base amplitudes (m), direction offsets from the wind (rad)
const WAVE_LEN = [2.9, 1.6, 0.85, 0.42];
const WAVE_AMP = [0.016, 0.011, 0.007, 0.004];
const WAVE_OFF = [0, 0.45, -0.5, 0.95];

// Pond outline control points (closed Catmull-Rom, metres, x east, z south)
const POND_CTRL = [
  [-6.0, -0.5], [-5.6, -2.6], [-4.3, -3.8], [-2.5, -4.1], [-1.1, -4.7], [0.4, -4.95], [1.6, -4.3],
  [2.35, -2.95], [3.6, -2.75], [5.0, -3.35], [6.1, -2.25], [6.25, -0.4], [5.45, 1.35], [4.0, 2.0],
  [2.85, 1.25], [1.6, 2.45], [0.2, 3.85], [-1.8, 4.3], [-3.8, 3.7], [-5.2, 2.3],
];

/* =====================================================================================
   1. MATH / NOISE UTILITIES
   ===================================================================================== */
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sq = (x) => x * x;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const smootherstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * t * (t * (t * 6 - 15) + 10); };
const fract = (x) => x - Math.floor(x);
const wrapAngle = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(20240611);
const rr = (a, b) => a + (b - a) * rand();
const rpick = (arr) => arr[Math.floor(rand() * arr.length) % arr.length];
function gauss() { let u = 0, v = 0; while (u === 0) u = rand(); v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function hash2i(x, y, s = 0) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(s | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hash3i(x, y, z, s = 0) { return hash2i(Math.imul(x | 0, 0x2c1b3c6d) ^ (z | 0), y, s); }
const hash1 = (n) => hash2i(n, 0x3b9f, 7);

// value noise, periodic when p > 0 (for tileable textures); returns [-1, 1]
function vnoise2(x, y, s = 0, p = 0) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  let x0 = xi, x1 = xi + 1, y0 = yi, y1 = yi + 1;
  if (p > 0) { x0 = ((x0 % p) + p) % p; x1 = ((x1 % p) + p) % p; y0 = ((y0 % p) + p) % p; y1 = ((y1 % p) + p) % p; }
  const a = hash2i(x0, y0, s), b = hash2i(x1, y0, s), c = hash2i(x0, y1, s), d = hash2i(x1, y1, s);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
function vnoise3(x, y, z, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const h = (i, j, k) => hash3i(xi + i, yi + j, zi + k, s);
  const x00 = lerp(h(0, 0, 0), h(1, 0, 0), u), x10 = lerp(h(0, 1, 0), h(1, 1, 0), u);
  const x01 = lerp(h(0, 0, 1), h(1, 0, 1), u), x11 = lerp(h(0, 1, 1), h(1, 1, 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w) * 2 - 1;
}
function fbm2(x, y, oct = 5, s = 0, p = 0) {
  let a = 0.5, f = 1, sum = 0, n = 0;
  for (let i = 0; i < oct; i++) {
    sum += a * vnoise2(x * f, y * f, s + i * 31, p > 0 ? p * f : 0);
    n += a; a *= 0.5; f *= 2;
  }
  return sum / n;
}
function fbm3(x, y, z, oct = 4, s = 0) {
  let a = 0.5, f = 1, sum = 0, n = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise3(x * f, y * f, z * f, s + i * 31); n += a; a *= 0.5; f *= 2.03; }
  return sum / n;
}
// Catmull-Rom scalar interpolation
function catmull(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}
// sample a table of values defined at uniform s in [0,1] with Catmull-Rom interpolation
function sampleTable(tab, s) {
  const n = tab.length - 1;
  const x = clamp(s, 0, 1) * n;
  const i = Math.min(Math.floor(x), n - 1);
  const t = x - i;
  return catmull(tab[Math.max(i - 1, 0)], tab[i], tab[i + 1], tab[Math.min(i + 2, n)], t);
}
// closed Catmull-Rom through 2D control points -> dense polyline
function closedCatmull2D(ctrl, count) {
  const out = [], n = ctrl.length;
  for (let k = 0; k < count; k++) {
    const u = (k / count) * n, i = Math.floor(u), t = u - i;
    const p0 = ctrl[(i - 1 + n) % n], p1 = ctrl[i % n], p2 = ctrl[(i + 1) % n], p3 = ctrl[(i + 2) % n];
    out.push([catmull(p0[0], p1[0], p2[0], p3[0], t), catmull(p0[1], p1[1], p2[1], p3[1], t)]);
  }
  return out;
}
function distSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz + 1e-12), 0, 1);
  return Math.hypot(px - ax - dx * t, pz - az - dz * t);
}
// 2D tileable Voronoi (F1, F2, id) on a periodic grid of g cells, jitter j
function voronoiTile(u, v, g, seed, j = 0.85, weights = null) {
  const x = u * g, y = v * g;
  const xi = Math.floor(x), yi = Math.floor(y);
  let f1 = 1e9, f2 = 1e9, id = 0, cx = 0, cy = 0;
  for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
    const cxI = xi + ox, cyI = yi + oy;
    const wx = ((cxI % g) + g) % g, wy = ((cyI % g) + g) % g;
    const px = cxI + 0.5 + (hash2i(wx, wy, seed) - 0.5) * j;
    const py = cyI + 0.5 + (hash2i(wx, wy, seed + 1) - 0.5) * j;
    let d = Math.hypot(x - px, y - py);
    if (weights) d -= weights(wx, wy);
    if (d < f1) { f2 = f1; f1 = d; id = wy * g + wx; cx = px; cy = py; } else if (d < f2) f2 = d;
  }
  return { f1, f2, id, cx, cy };
}

/* =====================================================================================
   2. PROCEDURAL TEXTURES
   ===================================================================================== */
let MAX_ANISO = 8;
function dataTex(data, w, h, opts = {}) {
  const t = new THREE.DataTexture(data, w, h, opts.format || THREE.RGBAFormat, opts.type || THREE.UnsignedByteType);
  t.wrapS = t.wrapT = opts.wrap === undefined ? THREE.RepeatWrapping : opts.wrap;
  t.magFilter = opts.mag || THREE.LinearFilter;
  t.minFilter = opts.min || (opts.mips === false ? THREE.LinearFilter : THREE.LinearMipmapLinearFilter);
  t.generateMipmaps = opts.mips !== false;
  t.anisotropy = opts.aniso || MAX_ANISO;
  if (opts.srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.flipY = false;
  t.needsUpdate = true;
  return t;
}
// height field (Float32Array w*h, wraps) -> RGBA8 normal map (xy in RG, z in B), A passthrough
function heightToNormal(hf, w, h, strength, alpha = null, wrap = true) {
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const xm = wrap ? (x - 1 + w) % w : Math.max(x - 1, 0), xp = wrap ? (x + 1) % w : Math.min(x + 1, w - 1);
    const ym = wrap ? (y - 1 + h) % h : Math.max(y - 1, 0), yp = wrap ? (y + 1) % h : Math.min(y + 1, h - 1);
    const dx = (hf[y * w + xp] - hf[y * w + xm]) * 0.5 * strength;
    const dy = (hf[yp * w + x] - hf[ym * w + x]) * 0.5 * strength;
    const il = 1 / Math.hypot(dx, dy, 1);
    const i = (y * w + x) * 4;
    out[i] = (-dx * il * 0.5 + 0.5) * 255;
    out[i + 1] = (-dy * il * 0.5 + 0.5) * 255;
    out[i + 2] = (il * 0.5 + 0.5) * 255;
    out[i + 3] = alpha ? alpha[y * w + x] : 255;
  }
  return out;
}
const TEX = {};

// River-pebble floor: additively weighted Voronoi -> rounded stones of varied size and colour.
function makePebbleTextures() {
  const N = 512, G = 13;
  const col = new Uint8Array(N * N * 4), hf = new Float32Array(N * N), ao = new Uint8Array(N * N);
  const pal = [[0.28, 0.27, 0.25], [0.36, 0.33, 0.28], [0.20, 0.20, 0.21], [0.42, 0.40, 0.36], [0.30, 0.24, 0.18],
    [0.52, 0.50, 0.46], [0.16, 0.16, 0.17], [0.38, 0.30, 0.22], [0.25, 0.26, 0.28], [0.46, 0.42, 0.34]];
  const wfun = (x, y) => (hash2i(x, y, 91) - 0.5) * 0.34;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N;
    const w = voronoiTile(u + fbm2(u * 6, v * 6, 2, 3, 6) * 0.012, v + fbm2(u * 6 + 9, v * 6, 2, 4, 6) * 0.012, G, 17, 0.9, wfun);
    const edge = w.f2 - w.f1;
    const dome = Math.pow(smoothstep(0.0, 0.42, edge), 0.55);
    const speck = fbm2(u * 90, v * 90, 2, w.id, 90) * 0.5 + 0.5;
    const hsh = hash2i(w.id, 3, 5);
    const c = pal[Math.floor(hsh * pal.length)];
    const vein = Math.abs(fbm2(u * 22 + hsh * 7, v * 22, 3, w.id + 9, 22)) < 0.035 && hsh > 0.6 ? 1 : 0;
    const shade = 0.78 + 0.42 * hash2i(w.id, 8, 2) + (speck - 0.5) * 0.18;
    const gap = smoothstep(0.08, 0.0, edge);
    const i = (y * N + x) * 4;
    for (let k = 0; k < 3; k++) {
      let cv = c[k] * shade;
      if (vein) cv = cv * 0.4 + 0.5;
      cv = lerp(cv, [0.07, 0.065, 0.05][k], gap);
      col[i + k] = clamp(Math.pow(cv, 1 / 2.2), 0, 1) * 255; // stored sRGB
    }
    col[i + 3] = 255;
    hf[y * N + x] = dome * (0.8 + 0.4 * hash2i(w.id, 4, 4)) + speck * 0.04;
    ao[y * N + x] = (0.35 + 0.65 * smoothstep(0.0, 0.2, edge)) * 255;
  }
  TEX.pebble = dataTex(col, N, N, { srgb: true });
  TEX.pebbleN = dataTex(heightToNormal(hf, N, N, 26, ao), N, N);
}
// Moss / ground cover detail: soft cushions with fine texture.
function makeMossTextures() {
  const N = 512;
  const col = new Uint8Array(N * N * 4), hf = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N;
    const cush = fbm2(u * 10, v * 10, 4, 11, 10) * 0.5 + 0.5;         // soft cushions
    const tone = fbm2(u * 3, v * 3, 3, 14, 3) * 0.5 + 0.5;             // patchy colour
    const fine = fbm2(u * 128, v * 128, 2, 12, 128) * 0.5 + 0.5;       // velvet grain
    const tip = hash2i(x >> 1, y >> 1, 77);                            // tiny shoot tips catching light
    const tipB = tip > 0.82 ? (tip - 0.82) * 3.5 : 0;
    const dry = smoothstep(0.62, 0.8, fbm2(u * 5 + 3, v * 5, 3, 15, 5) * 0.5 + 0.5);
    const deep = [0.028, 0.062, 0.014], lime = [0.085, 0.13, 0.022], brown = [0.09, 0.075, 0.035];
    const i = (y * N + x) * 4;
    for (let k = 0; k < 3; k++) {
      let c = lerp(deep[k], lime[k], clamp(cush * 0.7 + tone * 0.5 - 0.15, 0, 1));
      c = lerp(c, brown[k], dry * 0.55);
      c *= 0.78 + 0.34 * fine + tipB * 0.5;
      col[i + k] = clamp(Math.pow(c, 1 / 2.2), 0, 1) * 255;
    }
    col[i + 3] = 255;
    hf[y * N + x] = cush * 0.9 + fine * 0.22 + tipB * 0.15;
  }
  TEX.moss = dataTex(col, N, N, { srgb: true });
  TEX.mossN = dataTex(heightToNormal(hf, N, N, 7), N, N);
}
// Caustic network: warped Voronoi cell borders (bright lines), tileable, single channel.
function makeCausticTexture() {
  const N = 512, G = 7;
  const d = new Uint8Array(N * N * 4);
  let sum = 0;
  const vals = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N;
    const wu = u + fbm2(u * 4, v * 4, 3, 71, 4) * 0.05, wv = v + fbm2(u * 4 + 5, v * 4 + 3, 3, 72, 4) * 0.05;
    const w = voronoiTile(wu, wv, G, 73, 0.95);
    const e = w.f2 - w.f1;
    const c = Math.exp(-e * 6.0) * 1.0 + Math.exp(-e * 2.2) * 0.45 + 0.16;
    vals[y * N + x] = c; sum += c;
  }
  const mean = sum / (N * N);
  for (let i = 0; i < N * N; i++) { const c = clamp(vals[i] / mean * 0.35, 0, 1); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = c * 255; d[i * 4 + 3] = 255; }
  TEX.caustics = dataTex(d, N, N);
  TEX.causticsMean = 0.35; // value/mean normalisation baked above -> mean of stored value
}

/* =====================================================================================
   3. GEOMETRY HELPERS
   ===================================================================================== */
// Merge BufferGeometries (non-indexed or indexed) with identical attribute sets.
function mergeGeoms(list) {
  list = list.filter(Boolean);
  const names = Object.keys(list[0].attributes);
  const out = new THREE.BufferGeometry();
  let vcount = 0, icount = 0;
  for (const g of list) { vcount += g.attributes.position.count; icount += g.index ? g.index.count : g.attributes.position.count; }
  for (const n of names) {
    const a0 = list[0].attributes[n];
    const arr = new Float32Array(vcount * a0.itemSize);
    let o = 0;
    for (const g of list) {
      const a = g.attributes[n];
      if (!a) throw new Error('mergeGeoms: missing attribute ' + n);
      arr.set(a.array.subarray(0, a.count * a.itemSize), o); o += a.count * a.itemSize;

const SKY_VERT = /* glsl */`

function makeSkyMaterial() {

      mieDirectionalG: { value: 0.8 }, uSkyScale: { value: 0.42 }, uCloud: { value: 0.55 }, uOvercast: { value: 0 }, uTime: G.uTime,
      uWindDir: G.uWindDir, uCloudSun: { value: new THREE.Color() }, uCloudAmb: { value: new THREE.Color() }, uGround: { value: new THREE.Color(0.05, 0.055, 0.04) },

// Preetham extinction for the direct sun (JS mirror of the sky shader)
function sunTransmittance(dir, turbidity) {
  const zen = Math.acos(clamp(dir.y, 0, 1));
  const inv = 1 / (Math.cos(zen) + 0.15 * Math.pow(Math.max(93.885 - zen / DEG, 1e-3), -1.253));
  const sR = 8400 * inv, sM = 1250 * inv;
  const bR = [5.804542996261093e-6, 1.3562911419845635e-5, 3.0265902468824876e-5];
  const mc = [1.8399918514433978e14, 2.7798023919660528e14, 4.0790479543861094e14];
  const c = 0.2 * turbidity * 10e-18;
  return bR.map((b, i) => Math.exp(-(b * sR + 0.434 * c * mc[i] * 0.005 * sM)));
}

  const a = (az + (tod - 10.5) * 13) * DEG;
  return out.set(Math.cos(a) * Math.cos(el), Math.max(Math.sin(el), 0.02), Math.sin(a) * Math.cos(el)).normalize();

// Recompute sun/sky/light/water-optics state from the blended environment.

  const sd = env.sunDir;
  const Fex = sunTransmittance(sd, env.turbidity);

  const lum = soft[0] * 0.2126 + soft[1] * 0.7152 + soft[2] * 0.0722;
  const elevFade = smoothstep(0.0, 0.14, sd.y);

  const zenCos = sd.y;
  const bright = (1 - Math.exp(-(1.611 - Math.acos(zenCos)) / 1.5)) / 0.487;
  env.sunI = 3.3 * clamp(bright, 0, 1.4) * lerp(1, lum * 1.1, 0.35) * env.sunMul * (1 - 0.92 * env.overcast * 0) * elevFade;

  sunLight.intensity = env.sunI;
  sunLight.position.copy(sd).multiplyScalar(70).add(sunLight.target.position);

  const sky = skyMesh.material.uniforms;
  sky.sunPosition.value.copy(sd);

  sky.uOvercast.value = env.overcast;

  sky.uSunDisc.value = 1 - env.overcast;

function updateWind(t) {
  const a = (P.windDir + 25 * fbm2(t * 0.013, 3.7, 2)) * DEG;

  G.uGust.value = g * g * env.wind * 1.8;

  const base = Math.atan2(G.uWindDir.value.y, G.uWindDir.value.x);
  const ampScale = (0.3 + env.wind * 1.4) * P.waveHeight * (1 - 0.85 * env.ice);

    const k = (2 * Math.PI) / WAVE_LEN[i], a2 = base + WAVE_OFF[i];
    G.uWaves.value[i].set(Math.cos(a2), Math.sin(a2), k, WAVE_AMP[i] * ampScale);

    const w = G.uWaves.value[i];

}

uniform float uTime;
uniform float uWaterY;
uniform vec3 uSunDir;
uniform vec3 uSunDirW;
uniform vec3 uSunColor;

uniform sampler2D tRipple;

vec3 causticsAt(vec3 p, float depth) {
  vec2 e = p.xz + uSunDirW.xz / max(uSunDirW.y, 0.25) * depth;

  c.g = texture2D(tCaustics, u1).r * texture2D(tCaustics, u2).r;
  c.b = texture2D(tCaustics, u1 - disp).r * texture2D(tCaustics, u2 - disp).r;

float koiLat(float s, vec4 B) {

}
float koiHalfW(float s) {

  float tail = s > 0.96 ? 0.085 * smoothstep(0.96, 1.26, s) * (1.0 - smoothstep(1.24, 1.3, s)) * 0.6 : 0.0;

// analytic soft shadow of every koi: walk up the refracted sun ray to the fish's depth and test its silhouette
float koiShadow(vec3 p, float selfId) {
  float sh = 0.0;
  vec2 slope = uSunDirW.xz / max(uSunDirW.y, 0.25);
  for (int i = 0; i < MAX_KOI; i++) {
    if (float(i) >= uKoiN) break;
    if (abs(float(i) - selfId) < 0.5) continue;
    vec4 A = uKoiA[i];
    float h = A.y - p.y;
    if (h <= 0.005) continue;
    vec4 B = uKoiB[i];

  if (opts.hedge) defs.HEDGE = '';
  if (opts.leaf) defs.LEAF = '';
  if (opts.deciduous) defs.DECIDUOUS = '';
  if (opts.wood) defs.WOOD = '';

const nextFrame = () => new Promise((r) => requestAnimationFrame(() => r()));

function updateShadows() {
  // shadow map every other frame, rendered through a camera that sees every layer
  if (clock.frame % 2 === 0 || clock.frame < 3) {
    renderer.shadowMap.needsUpdate = true;
    renderer.setRenderTarget(RT.dummy);
    renderer.render(scene, shadowCam);
  }
}
let shadowCam;

const frameInfo = { calls: 0, tris: 0 };
function renderFrame() {
  renderer.info.reset();
  const t = clock.t;
  G.uTime.value = t;
  updateWind(t);
  updateEnvironment();
  skyMesh.position.copy(camera.position);
  // shadows
  updateShadows();
  // main pass
  camera.layers.set(0);
  for (const l of [LAYER.ABOVE, LAYER.BOTH, LAYER.WATER, LAYER.SKY, LAYER.SURFACE, LAYER.UNDER]) camera.layers.enable(l);
  G.uViewPath.value = 1;
  renderer.setRenderTarget(RT.main);
  renderer.setClearColor(0x000000, 0);
  renderer.clear(true, true, false);
  renderer.render(scene, camera);
  // composite
  compositeMat.uniforms.tHDR.value = RT.main.texture;
  compositeMat.uniforms.uExposure.value = P.exposure * env.exposure / 0.9;
  compositeMat.uniforms.uVignette.value = P.vignette;
  compositeMat.uniforms.uGrain.value = P.grain;
  fsPass(compositeMat, null);
  frameInfo.calls = renderer.info.render.calls; frameInfo.tris = renderer.info.render.triangles;
}

function tick(now) {
  if (!KOI.paused) requestAnimationFrame(tick);
  const realDt = Math.min((now - clock.last) / 1000, 0.25);
  clock.last = now;
  step(clock.fixed ? 1 / 60 : Math.min(realDt, 1 / 15), realDt);
}
function step(dt, realDt = dt) {
  const t0 = performance.now();
  clock.dt = dt;
  if (!P.freeze) clock.t += dt;
  clock.elapsed += dt;
  clock.frame++;
  updateManualCamera(dt);
  renderFrame();
  const ms = performance.now() - t0;
  perf.acc += realDt; perf.n++;
  if (perf.acc > 0.5) {
    perf.fps = perf.n / perf.acc; perf.ms = (perf.acc / perf.n) * 1000; perf.acc = 0; perf.n = 0;
    document.getElementById('fps').textContent = perf.fps.toFixed(0);
    document.getElementById('ms').textContent = perf.ms.toFixed(1);
  }
  perf.cpuMs = ms;
}

// Test / automation API
const KOI = {
  ready: false, paused: false,
  view(p, t) { lookAt(p[0], p[1], p[2], t[0], t[1], t[2]); },
  frames(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) step(dt); this.sync(); },
  sync() { const px = new Uint8Array(4); renderer.setRenderTarget(null); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return px; },
  bench(n = 10) {
    this.sync();
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { step(1 / 60); this.sync(); }
    const ms = (performance.now() - t0) / n;
    return { ms, fps: 1000 / ms, calls: frameInfo.calls, tris: frameInfo.tris, w: RT.w, h: RT.h };
  },
  pause(v = true) { this.paused = v; if (!v) { clock.last = performance.now(); requestAnimationFrame(tick); } },
  set(k, v) { P[k] = v; },
  env,
  get P() { return P; },
  info() { return { calls: frameInfo.calls, tris: frameInfo.tris, programs: renderer.info.programs.length, textures: renderer.info.memory.textures, geometries: renderer.info.memory.geometries }; },
};
window.KOI = KOI;

async function init() {
  const steps = [
    ['Renderer', buildRenderer],
    ['Textures', () => { makePebbleTextures(); makeMossTextures(); makeCausticTexture(); G.tCaustics.value = TEX.caustics; }],
    ['Sky & light', buildSkyAndLights],
    ['Pond outline', buildPondOutline],
    ['Pond floor', buildFloorGrid],
    ['Terrain', buildTerrain],
    ['Water', buildWater],
    ['Post-processing', buildPost],
  ];
  for (let i = 0; i < steps.length; i++) {
    setLoader(i / steps.length, steps[i][0] + '…');
    await nextFrame();
    const t0 = performance.now();
    steps[i][1]();
    if (TEST) console.log('[build] ' + steps[i][0] + ' ' + (performance.now() - t0).toFixed(0) + ' ms');
  }
  shadowCam = new THREE.PerspectiveCamera(10, 1, 0.1, 1);
  shadowCam.position.set(0, -5000, 0); shadowCam.lookAt(0, -6000, 0); shadowCam.layers.enableAll(); shadowCam.updateMatrixWorld();
  setupInput();
  lookAt(0.6, 2.4, 10.5, 0, -0.3, 0);
  G.tRipple.value = null;
  updateWind(0);
  updateEnvironment(true);
  setLoader(1, 'Compiling shaders…');
  await nextFrame();
  step(1 / 60);
  document.getElementById('loader').classList.add('done');
  if (TEST) document.getElementById('loader').style.display = 'none';
  KOI.ready = true;
  if (!TEST) requestAnimationFrame(tick);
  else KOI.paused = true;
}
init().catch((e) => { console.error(e); setLoader(0, 'Error: ' + e.message); });
</script>
